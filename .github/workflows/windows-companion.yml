name: Windows companion

on:
  workflow_dispatch:
  push:
    branches:
      - milestone-11-windows-companion
      - milestone-12-bidirectional-companion-sync
    paths:
      - "app/**"
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/windows-companion.yml"

jobs:
  build-windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Test Android and desktop companion
        run: gradle :app:testDebugUnitTest :desktopApp:test
      - name: Build Windows MSI
        run: gradle :desktopApp:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: RiderNotesPC-Windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
