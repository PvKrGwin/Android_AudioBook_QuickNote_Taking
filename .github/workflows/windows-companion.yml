name: Windows companion

on:
  workflow_dispatch:
  push:
    branches:
      - milestone-11-windows-companion
      - milestone-12-bidirectional-companion-sync
      - milestone-13-delta-sync-foundation
    paths:
      - "app/**"
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/windows-companion.yml"

jobs:
  build-windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Test Android and desktop companion
        run: gradle :app:testDebugUnitTest :desktopApp:test
      - name: Build and verify bundled Windows runtime
        shell: pwsh
        run: |
          gradle :desktopApp:createDistributable
          $jvm = "desktopApp/build/compose/binaries/main/app/RiderNotesPC/runtime/bin/server/jvm.dll"
          $exe = "desktopApp/build/compose/binaries/main/app/RiderNotesPC/RiderNotesPC.exe"
          if (-not (Test-Path $jvm)) {
            throw "Packaged Java runtime is missing $jvm"
          }
          if (-not (Test-Path $exe)) {
            throw "Packaged application launcher is missing $exe"
          }
          Write-Host "Verified bundled JVM: $jvm"
          $stdout = Join-Path $env:RUNNER_TEMP "rider-notes-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "rider-notes-stderr.log"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Packaged Rider Notes exited during the startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged Rider Notes stayed running during the startup smoke test"
      - name: Build Windows MSI
        run: gradle :desktopApp:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: RiderNotesPC-Windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
      - name: Create portable Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path desktopApp/build/compose/binaries/main/app/RiderNotesPC -DestinationPath desktopApp/build/RiderNotesPC-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RiderNotesPC-Portable
          path: desktopApp/build/RiderNotesPC-Portable.zip
