name: Package folder rename test build

on:
  push:
    branches:
      - milestone-12-folder-rename
    paths:
      - ".github/workflows/package-folder-rename.yml"

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Test Android and desktop companion
        run: gradle :app:testDebugUnitTest :desktopApp:test
      - name: Build and verify bundled Windows runtime
        shell: pwsh
        run: |
          gradle :desktopApp:createDistributable
          $jvm = "desktopApp/build/compose/binaries/main/app/RiderNotesPC/runtime/bin/server/jvm.dll"
          $exe = "desktopApp/build/compose/binaries/main/app/RiderNotesPC/RiderNotesPC.exe"
          if (-not (Test-Path $jvm)) { throw "Packaged Java runtime is missing: $jvm" }
          if (-not (Test-Path $exe)) { throw "Packaged PC executable is missing: $exe" }
          $stdout = Join-Path $env:RUNNER_TEMP "rider-notes-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "rider-notes-stderr.log"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Rider Notes PC exited during startup verification with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/RiderNotesPC -DestinationPath desktopApp/build/RiderNotesPC-Folder-Rename-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RiderNotesPC-Folder-Rename-Portable
          path: desktopApp/build/RiderNotesPC-Folder-Rename-Portable.zip
