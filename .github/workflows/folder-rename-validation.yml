name: Validate Topic folder rename

on:
  push:
    branches:
      - milestone-12-folder-rename
    paths:
      - "app/**"
      - "desktopApp/**"
      - ".github/workflows/folder-rename-validation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Test Android and desktop companion
        run: gradle :app:testDebugUnitTest :desktopApp:test
